<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Verschmiedet. · Logge Media Forge</title>
    <meta name="description" content="Diese Seite ist beim Schmieden verloren gegangen." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ede9e2" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      try {
        const d = document.documentElement, s = localStorage;
        d.classList.add("js");
        const t = s.getItem("lmf-theme");
        d.dataset.theme = t === "dark" || t === "light" ? t
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (s.getItem("lmf-motion") === "paused") d.dataset.motion = "paused";
        document.querySelector('meta[name="theme-color"]').content = d.dataset.theme === "dark" ? "#0e0c0b" : "#ede9e2";
      } catch {}
    </script>
    <link rel="preload" href="/assets/fonts/InstrumentSerif-Italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <style>
      @layer sections {
        .lost {
          min-block-size: calc(100svh - var(--header-h));
          display: grid;
          align-content: center;
          gap: var(--s5);
          padding-block: var(--s9);
          position: relative;
        }
        .lost-no {
          position: absolute;
          inset-inline-end: var(--gutter);
          inset-block-start: 50%;
          translate: 0 -50%;
          z-index: -1;
          font-family: var(--font-display);
          font-size: var(--t-numeral);
          line-height: 0.8;
          color: transparent;
          -webkit-text-stroke: 1px var(--control);
          user-select: none;
        }
        /* Narrow screens: the outline numeral sits above the copy instead of across it. */
        @media (max-width: 719px) {
          .lost-no {
            position: static;
            translate: none;
            z-index: auto;
            font-size: clamp(6rem, 2rem + 18vw, 9rem);
            margin-block-end: calc(var(--s5) * -1);
          }
        }
        .lost h1 {
          font-size: clamp(3.4rem, 1.4rem + 10vw, 11rem);
          line-height: var(--lh-hero);
          letter-spacing: var(--track-hero);
        }
        .lost h1 em {
          color: var(--brand);
        }
        .lost .lead {
          max-inline-size: 32ch;
        }
        .lost-bar {
          block-size: 6px;
          inline-size: min(360px, 70%);
          background: linear-gradient(90deg, var(--heat-0), var(--heat-1) 30%, var(--heat-2) 55%, var(--heat-3) 80%, var(--heat-4));
          clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%);
        }
        .site-header .site-header-inner {
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <symbol id="i-logo" viewBox="0 0 2510 1500" fill="currentColor"><path d="M60 1387c0-4 174-779 210-932l51-222 21-93h129c71 0 129 1 129 3l-49 218c-144 634-172 756-177 772l-5 17h121v13c0 6-12 60-27 120l-28 107H248c-104 0-188-1-188-3zM622 858l139-625 21-93h288l2 238 3 237 141-235 140-235 163-3 163-3-4 13c-3 7-49 212-103 456l-98 442h-275l4-17c38-164 74-327 72-329-2-1-43 76-93 172l-90 174H900l-2-166-3-166-74 336-74 336H503l119-532z"/><path d="M810 1381c0-16 48-210 55-221l6-10h1280l-5 18-27 120-22 102H810v-9zM1550 1048l69-308 68-305 328-3 327-2-5 13c-2 7-15 59-27 115l-23 102h-414l-37 173-43 195-5 22h-119c-65 0-119-1-119-2zM1714 318l22-105 16-73h650l-5 23-23 105-17 82h-649l6-32z"/></symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
      </defs>
    </svg>
    <header class="site-header">
      <div class="site-header-inner shell">
        <a class="brand" href="/">
          <svg class="brand-logo" aria-hidden="true" focusable="false"><use href="#i-logo" /></svg>
          <span class="brand-word"><span>Logge</span><span>Media Forge</span></span>
          <span class="vh">, zur Startseite</span>
        </a>
      </div>
      <div class="gluehlinie" aria-hidden="true"></div>
    </header>
    <main id="main-content">
      <section class="lost shell" aria-labelledby="lost-title">
        <span class="lost-no" aria-hidden="true">404</span>
        <p class="eyebrow">Seite nicht gefunden</p>
        <h1 id="lost-title"><em>Verschmiedet.</em></h1>
        <div class="lost-bar" aria-hidden="true"></div>
        <p class="lead">Diese Seite ist beim Schmieden verloren gegangen.</p>
        <p><a class="button" href="/">Zurück in die Werkstatt <svg class="i" aria-hidden="true" focusable="false"><use href="#i-arrow-right" /></svg></a></p>
      </section>
    </main>
  </body>
</html>
